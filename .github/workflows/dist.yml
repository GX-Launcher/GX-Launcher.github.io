on:
  push:
  workflow_dispatch:

jobs:
  dist:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - id: pat
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
      - if: steps.pat.outputs.set == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.pat.outputs.set == 'true'
        run: |
          rm -rf .git
          git init
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "$COMMIT_MSG" || true
          git push -u --force https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.event.repository.name }}/${{ github.event.repository.name }}.github.io.git main:main
        env:
          COMMIT_MSG: "${{ github.event.head_commit.message || 'chore: update launcher' }}"